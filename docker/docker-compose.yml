services:
  mariadb:
    image: mariadb:10.11
    container_name: inmotions_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - inmotions_net

  backend:
  build:
    context: ../backend
    dockerfile: Dockerfile
  container_name: inmotions_backend
  restart: unless-stopped
  environment:
    DB_HOST: ${DB_HOST}        # ← cambia "mariadb" por esto
    DB_PORT: ${DB_PORT}        # ← cambia 3306 por esto
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_NAME: ${DB_NAME}
    PORT: 3000
  ports:
    - "3000:3000"
  depends_on:
    - mariadb
  networks:
    - inmotions_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: inmotions_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - mariadb
    networks:
      - inmotions_net

volumes:
  db_data:

networks:
  inmotions_net:
    driver: bridge